# NVIDIA's released DIFR suspend/resume fix; see nvidia-difr-rca.md.
# Version-scoped override: newer driver releases do not inherit this patch.
# Manual opt-in only: install.sh never installs anything from omarchy/.
# Even if copied manually, do not patch other laptop models or stock kernels.
if [[ -r /sys/class/dmi/id/product_name ]] &&
   [[ $(< /sys/class/dmi/id/product_name) == 'ProArt P16 H7606WW_H7606WW' ]]; then
  PATCH[0]="nvidia-difr-suspend-resume.patch"
  PATCH_MATCH[0]='-omarchy$'
fi
