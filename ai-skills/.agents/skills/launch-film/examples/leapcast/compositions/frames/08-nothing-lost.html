      tl.to(el("dec-tail"), { opacity: 0, duration: 0.22, ease: "power1.inOut" }, 3.95);
      tl.fromTo(el("dec-wrap"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.inOut" }, 4.03);
      tl.fromTo(el("dband2"), { opacity: 0 }, { opacity: 10 / 14, duration: 0.22, ease: "power1.inOut" }, 4.03);

      // ── Typing (discrete-text-sequence, smooth-slice variation): one char per step, first char just after `at`
      function typeOn(parts, at, dur) {
        var total = parts.reduce(function (n, p) { return n + p.text.length; }, 0);
        var proxy = { v: 0 };
        tl.fromTo(
          proxy,
          { v: 0 },
          {
            v: 1,
            duration: dur,
            ease: "none",
            onUpdate: function () {
              var count = proxy.v <= 0 ? 0 : Math.min(total, 1 + Math.floor(proxy.v * (total - 1) + 1e-6));
              var left = count;
              parts.forEach(function (p) {
                var take = Math.max(0, Math.min(p.text.length, left));
                p.node.textContent = p.text.slice(0, take);
                left -= take;
              });
            }
          },
          at
        );
      }

      // ── Waterfall cut helper (cut-catalog §4)
      function entryOpacity(p) {
        return p <= 0 ? 0 : 0.35 + 0.65 * (1 - Math.pow(1 - p, 5));
      }
      function waterfall(outIds, inIds, cut) {
        var n = outIds.length;
        outIds.forEach(function (id, i) {
          var w = el(id);
          var start = cut - 0.18 - (n - 1 - i) * 0.022;
          tl.to(w, { x: -230, duration: 0.34, ease: "power4.in" }, start);
          tl.to(w, { opacity: 0, duration: 0.18, ease: "power1.in" }, start);
        });
        var gap = 0.05;
        var t = cut;
        inIds.forEach(function (id) {
          var w = el(id);
          tl.fromTo(w, { x: 230 }, { x: 0, duration: 0.3, ease: "power4.out" }, t);
          tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: entryOpacity }, t);
          t += gap;
          gap *= 0.84;
        });
      }

      // ── Scene 4 — SIGNATURE: each ghost first resolves IN PLACE at its Frame 3 vanish point
      //    (0.1 s: opacity 0→0.6, blur resolving, already at its flight scale 1.6), so the viewer
      //    sees where it comes from, then flies to its real row (scale 1.6→L about its left edge
      //    on power3.out) and locks. It stays soft (on screen blur ≥ 6px, opacity 0.6) over the
      //    first half of its path, while it crosses the panel's text, and sharpens to blur 0 /
      //    opacity 1 over the empty row slot. Ghosts sit above the panel with a ground halo.
      var L = 32.2 / 30; // the real row text at S 1.15 (28 source px) over the 30px ghost
      var G0 = 1.6; // flight start scale
      // the filter blurs in the ghost's own (scaled) space: 4.5px reads as ≈ 7px on screen at
      // 1.6 and ≈ 6px at the end of the soft stretch (scale ≈ 1.34)
      var SOFT_BLUR = 4.5;
      // blur / opacity ease for one flight, keyed on its path progress `keyEase`: held soft until
      // `softTo`, then 1 − ((1 − p) / (1 − softTo))³ of the way to blur 0 / opacity 1
      function flightLook(keyEase, softTo) {
        var key = gsap.parseEase(keyEase);
        return function (t) {
          var p = key(t);
          return p < softTo ? 0 : 1 - Math.pow((1 - p) / (1 - softTo), 3);
        };
      }
      // o: from {x, y}, resolveAt, flyAt, flyDur, xEase, yEase, keyEase (path progress), softTo
      function ghostReturn(g, o) {
        var look = flightLook(o.keyEase, o.softTo);
        tl.fromTo(
          g,
          { scale: G0, fontWeight: 500 },
          { scale: L, fontWeight: 400, duration: o.flyDur, ease: "power3.out" },
          o.flyAt
        );
        tl.fromTo(g, { x: o.from.x }, { x: 0, duration: o.flyDur, ease: o.xEase }, o.flyAt);
        tl.fromTo(g, { y: o.from.y }, { y: 0, duration: o.flyDur, ease: o.yEase }, o.flyAt);
        tl.fromTo(g, { opacity: 0 }, { opacity: 0.6, duration: 0.1, ease: "expo.out" }, o.resolveAt);
        tl.to(g, { opacity: 1, duration: o.flyDur, ease: look }, o.flyAt);
        tl.fromTo(
          g,
          { filter: "blur(14px)" },
          { filter: "blur(" + SOFT_BLUR + "px)", duration: 0.1, ease: "expo.out" },
          o.resolveAt
        );
        tl.to(g, { filter: "blur(0px)", duration: o.flyDur, ease: look }, o.flyAt);
        // the halo is only for the crossing: it clears over the empty row slot just before the
        // lock, so it never darkens the landing bloom
        tl.fromTo(
          g,
          { textShadow: "0 0 10px rgba(14,16,17,1), 0 0 10px rgba(14,16,17,1)" },
          { textShadow: "0 0 10px rgba(14,16,17,0), 0 0 10px rgba(14,16,17,0)", duration: 0.1, ease: "none" },
          o.flyAt + o.flyDur - 0.1
        );
      }
      // Both ghosts drop first (y on expo.out, soft, to the right of the Action items heading) and
      // then glide left into their row (x on power2.inOut), so neither lands on the heading;
      // they stay soft over the first half of that path (75% of the drop).
      // ghost B: (980, 652) → row 2 (780, 778), resolves 3.87–3.97, flies 3.97–4.37
      var ghostB = el("ghost-b");
      ghostReturn(ghostB, {
        from: { x: 200.97, y: -128.61 },
        resolveAt: 3.87,
        flyAt: 3.97,
        flyDur: 0.4,
        xEase: "power2.inOut",
        yEase: "expo.out",
        keyEase: "expo.out",
        softTo: 0.75
      });
      // landing B (4.37): bloom + pop, patch off, rebuilt hands over to the real row
      tl.set(el("bloom-b"), { opacity: 1, scaleX: 0.94 }, 4.37);
      tl.to(el("bloom-b"), { opacity: 0, scaleX: 1.03, duration: 0.5, ease: "power2.out" }, 4.37);
      tl.fromTo(el("p-row2"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 4.37);
      tl.to(ghostB, { opacity: 0, duration: 0.25, ease: "power1.inOut" }, 4.47);
      // owner "Bikash Phukan" types 4.37–4.71, then hands over to the real pixels
      typeOn([{ node: el("ob-text"), text: "Bikash Phukan" }], 4.37, 0.34);
      tl.set(el("caret-b"), { display: "inline-block" }, 4.37);
      tl.set(el("caret-b"), { display: "none" }, 4.8);
      tl.fromTo(el("p-own2"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 4.8);
      tl.to(el("own-b"), { opacity: 0, duration: 0.15, ease: "none" }, 4.9);
      // the named owner gets the emphasis: a terracotta-tint band sweeps behind "Bikash Phukan"
      // as its typing finishes (4.71–5.01) and rests
      tl.fromTo(el("own-band"), { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 4.71);

      // headline waterfall → "Who / owns it." on the landing
      waterfall(["w-what", "w-was", "w-decided"], ["w-who", "w-owns", "w-it"], 4.37);

      // ghost A: (1060, 156) → row 1 (780, 675), resolves 4.37–4.47, flies 4.47–4.85; its drop
      // crosses the Summary and the decision while soft, over its feathered backing
      var ghostA = el("ghost-a");
      ghostReturn(ghostA, {
        from: { x: 280.97, y: -519.04 },
        resolveAt: 4.37,
        flyAt: 4.47,
        flyDur: 0.38,
        xEase: "power2.inOut",
        yEase: "expo.out",
        keyEase: "expo.out",
        softTo: 0.75
      });
      // its feathered backing resolves with it, rides the same path and clears before the row
      var plateA = el("ghost-a-plate");
      tl.fromTo(plateA, { scale: G0 }, { scale: L, duration: 0.38, ease: "power3.out" }, 4.47);
      tl.fromTo(plateA, { x: 280.97 }, { x: 0, duration: 0.38, ease: "power2.inOut" }, 4.47);
      tl.fromTo(plateA, { y: -519.04 }, { y: 0, duration: 0.38, ease: "expo.out" }, 4.47);
      tl.fromTo(plateA, { opacity: 0 }, { opacity: 0.4, duration: 0.1, ease: "expo.out" }, 4.37);
      tl.to(plateA, { opacity: 0, duration: 0.1, ease: "power1.inOut" }, 4.72);
      tl.set(el("bloom-a"), { opacity: 1, scaleX: 0.94 }, 4.85);
      tl.to(el("bloom-a"), { opacity: 0, scaleX: 1.03, duration: 0.5, ease: "power2.out" }, 4.85);
      tl.fromTo(el("p-row1"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 4.85);
      tl.to(ghostA, { opacity: 0, duration: 0.25, ease: "power1.inOut" }, 4.95);
      // owner "Unassigned · tonight" types 4.85–5.34
      typeOn(
        [
          { node: el("oa-text"), text: "Unassigned \u00b7 " },
          { node: el("tonight"), text: "tonight" }
        ],
        4.85,
        0.49
      );
      tl.set(el("caret-a"), { display: "inline-block" }, 4.85);
      tl.set(el("caret-a"), { display: "none" }, 5.46);

      // ── Scene 5 — "And / by when." + "tonight" glows, underline draws
      waterfall(["w-who", "w-owns", "w-it"], ["w-and", "w-by", "w-when"], 6.3);
      tl.fromTo(
        el("tonight"),
        { color: "#c3c0b6", textShadow: "0 0 0px rgba(217,127,96,0)" },
        { color: "#d97f60", textShadow: "0 0 10px rgba(217,127,96,0.45)", duration: 0.3, ease: "power2.out" },
        6.3
      );
      tl.fromTo(el("underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 6.3);
      // "tonight" becomes the one focal: "Unassigned ·" dims to ≈55% (#0E1011 45% overlay) and
      // the owner band settles from 20% to 8%
      tl.fromTo(el("dim-a"), { opacity: 0 }, { opacity: 0.45, duration: 0.3, ease: "power1.inOut" }, 6.3);
      tl.to(el("own-band"), { opacity: 0.08 / 0.2, duration: 0.3, ease: "power1.inOut" }, 6.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
