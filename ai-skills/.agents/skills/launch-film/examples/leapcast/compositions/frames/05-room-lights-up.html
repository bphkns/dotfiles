    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        var ID = "05-room-lights-up";
        var el = function (name) {
          return document.getElementById(ID + "-" + name);
        };
        var world = el("world");
        var knockout = el("knockout");
        var pushGroups = [el("mask-push"), el("stroke-push")];
        var letterEdge = [el("veil"), el("stroke")];
        var pills = [
          { node: el("pill-notes"), x: 491, y: 257, at: 1.94 },
          { node: el("pill-transcribing"), x: 283, y: 384, at: 2.43 },
          { node: el("pill-recording"), x: 39, y: 511, at: 2.91 },
        ];
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
        if (!world || !knockout) return;

        // Camera: one proxy u (0→1) drives the room world from cam(0.5, 1510, 940)
        // to cam(1.0, 2040, 540) in ONE continuous move 0.97–1.94 (power2.inOut:
        // the rush accelerates, peaks at the mask removal 1.46, lands on bar 9).
        // S interpolates in log space; the centre lags the zoom (cx ~ u², cy ~ u^1.5)
        // so the room already covers the frame at 1.46 (cam(0.715, 1651, 792))
        // and keeps covering it to the lock.
        // cam(S,cx,cy) → world translate(960 − cx·S, 540 − cy·S) scale(S), origin 0 0
        var camWrite = function (u) {
          var s = Math.exp(Math.log(0.5) * (1 - u));
          var x = 960 - (1510 + 530 * u * u) * s;
          var y = 540 - (940 - 400 * Math.pow(u, 1.5)) * s;
          world.style.transform = "translate(" + x.toFixed(3) + "px, " + y.toFixed(3) + "px) scale(" + s.toFixed(5) + ")";
        };
        var cam = { u: 0 };
        camWrite(0);
        var camUpdate = function () {
          camWrite(cam.u);
        };
        tl.fromTo(cam, { u: 0 }, { u: 1, duration: 0.97, ease: "power2.inOut", onUpdate: camUpdate }, 0.97);

        // scale s about (986, 594), the centre of the "c"'s bottom arm, as one
        // matrix(s 0 0 s 986(1−s) 594(1−s)); linear in s, so one ease is exact
        var push = function (s) {
          return "matrix(" + s + " 0 0 " + s + " " + (986 * (1 - s)).toFixed(3) + " " + (594 * (1 - s)).toFixed(3) + ")";
        };
        // Scene 1 (0.00–0.97): the name holds; the mask pushes gently
        tl.fromTo(pushGroups, { attr: { transform: push(1) } }, { attr: { transform: push(1.05) }, duration: 0.97, ease: "power2.out" }, 0);
        // Scene 2 (0.97–1.46): rush-through; the letter edge (stroke + veil) fades
        tl.to(pushGroups, { attr: { transform: push(20) }, duration: 0.49, ease: "power3.in" }, 0.97);
        tl.fromTo(letterEdge, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power1.in" }, 0.97);
        tl.set(knockout, { autoAlpha: 0 }, 1.46);

        // Scene 3 (1.46–1.94): pill patch on; scrim and signature fade up
        tl.fromTo(el("patch"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 1.46);
        tl.fromTo(el("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.out" }, 1.7);
        tl.fromTo(el("sig"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 1.7);

        // Scene 4 (1.94): headline line-masked rise on the bar-9 downbeat; the chat
        // body dims under the pill stack (lifted again as the pills dock)
        tl.fromTo(el("headline"), { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 1.94);
        tl.fromTo(el("headline"), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "none" }, 1.94);
        tl.fromTo(el("stackdim"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.94);
        tl.to(el("stackdim"), { opacity: 0, duration: 0.16, ease: "power2.in" }, 3.39);

        // Scenes 4–5: each pill springs into its 2.2× stack slot about its right edge
        pills.forEach(function (p) {
          tl.fromTo(p.node, { x: p.x, y: p.y, scale: 1.87, opacity: 0 }, { x: p.x, y: p.y, scale: 2.2, opacity: 1, duration: 0.4, ease: "power3.out" }, p.at);
        });

        // Scene 5 (3.39–3.82): the dock, staggered top to bottom by 0.05 s so each
        // pill clears the next one's path. Per pill, three nudge chains (power3.in
        // ramp 20% time / 10% distance, linear burst 18% / to 75%, power4.out tail
        // 62%): y over 0.33 s; scale over 0.231 s (near 1× before the top bar); x
        // over 0.28 s from +0.05 s (lifts clear of the headline, then slides left).
        // Notes 3.39–3.72, Transcribing 3.44–3.77, Recording 3.49–3.82.
        var nudge = function (node, prop, from, to, start, dur) {
          [[0.1, 0.2, "power3.in", 0], [0.75, 0.18, "none", 0.2], [1, 0.62, "power4.out", 0.38]].forEach(function (k) {
            var v = { duration: dur * k[1], ease: k[2] };
            v[prop] = from + (to - from) * k[0];
            tl.to(node, v, start + dur * k[3]);
          });
        };
        pills.forEach(function (p, i) {
          var t0 = 3.39 + 0.05 * i;
          nudge(p.node, "y", p.y, 0, t0, 0.33);
          nudge(p.node, "scale", 2.2, 1, t0, 0.231);
          nudge(p.node, "x", p.x, 0, t0 + 0.05, 0.28);
          // the stack halo lifts off over the pill's ramp and burst
          tl.to(p.node, { boxShadow: "0px 0px 0px 0px rgba(6, 5, 8, 0)", duration: 0.125, ease: "power1.in" }, t0);
        });

        // Handoff (the last 8th, from 3.63): the headline leaves up through its
        // line mask and the scrim lifts, both gone by 3.83 so every 30 fps frame
        // from 3.8333 to the cut shows only the room, the docked 1× pills and
        // the signature
        tl.fromTo(el("headline"), { yPercent: 0, opacity: 1 }, { yPercent: -100, opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, 3.63);
        tl.fromTo(el("scrim"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, 3.63);
      })();
    </script>
