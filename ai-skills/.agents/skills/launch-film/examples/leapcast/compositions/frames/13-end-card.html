    <script>
      (function () {
        "use strict";

        var ID = "13-end-card";
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;

        var el = function (name) {
          return document.getElementById(ID + "-" + name);
        };
        var glow = el("glow");
        var letters = el("mark-letters");
        var lettersInner = el("mark-letters-inner");
        var beta = el("mark-beta");
        var row1 = el("row-1");
        var row2 = el("row-2");
        var url = el("url");
        var price = el("price");
        if (!glow || !letters || !lettersInner || !beta || !row1 || !row2 || !url || !price) return;

        // Scene 1 (0.00-1.94): wordmark wipe on the bar-26 impact (hard cut in), glow bloom,
        // beta pop. The wipe starts at 0.00 on expo.out, so the first letters show by 0.10.
        tl.fromTo(
          glow,
          { opacity: 0, "--end-card-glow": 0.82 },
          { opacity: 1, "--end-card-glow": 1, duration: 0.99, ease: "power2.out" },
          0
        );
        tl.fromTo(
          letters,
          { "--end-card-wipe": 0 },
          { "--end-card-wipe": 808.4, duration: 0.74, ease: "expo.out" },
          0
        );
        tl.fromTo(
          lettersInner,
          { x: -35 },
          { x: 0, duration: 0.74, ease: "expo.out" },
          0
        );
        tl.fromTo(
          beta,
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
          0.74
        );

        // Scene 2 (1.94-3.16): line-masked headline on the bar-27 downbeat, URL, price.
        var rise = function (line, at) {
          tl.fromTo(line, { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, at);
          tl.fromTo(line, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.out" }, at);
        };
        rise(row1, 1.94);
        rise(row2, 2.02);

        tl.fromTo(
          url,
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          2.44
        );

        tl.fromTo(
          price,
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.24, ease: "power3.out" },
          2.92
        );
