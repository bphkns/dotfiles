## Auto-connect A2DP playback/capture profiles on Bluetooth devices.
## This helps speakers and receivers expose their audio profiles without
## requiring manual PipeWire/WirePlumber recovery.
##
## Headset profiles (hfp_hf, hsp_hs) stay in the list, as in PipeWire's
## default. Without them a headset's call link is only set up when an app
## opens its mic, and on AirPods Pro that switch kept dropping the card to
## "off" mid-call while the app still held a silent mic.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink a2dp_source ]
      }
    }
  }
]
