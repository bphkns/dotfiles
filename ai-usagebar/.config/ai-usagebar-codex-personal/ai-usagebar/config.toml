# Alt config for the SECOND Codex account ONLY.
# Used by the combined Waybar module and codex-personal TUI wrapper. Both run
# ai-usagebar with XDG_CONFIG_HOME=~/.config/ai-usagebar-codex-personal so this
# file becomes its config. This is the only supported way to point the OpenAI
# vendor at a non-default auth.json — there is no per-account CLI flag for it.
#
# The Omarchy theme still resolves from $HOME (not XDG_CONFIG_HOME), so this
# module stays theme-matched. Its cache is isolated via --cache-dir in waybar.

[ui]
primary = "openai"

[anthropic]
enabled = false

[openai]
enabled = true
# Personal account: bphkns@gmail.com. It is isolated from codex-dev and normal
# Codex CLI auth at ~/.codex/auth.json.
# codex requires CODEX_HOME to exist first, so mkdir before login:
#   mkdir -p ~/.config/ai-usagebar/accounts/codex-personal
#   CODEX_HOME=~/.config/ai-usagebar/accounts/codex-personal codex login
#   chmod 600 ~/.config/ai-usagebar/accounts/codex-personal/auth.json
codex_auth_path = "/home/bikash/.config/ai-usagebar/accounts/codex-personal/auth.json"

[zai]
enabled = false

[openrouter]
enabled = false

[deepseek]
enabled = false

[kimi]
enabled = false
