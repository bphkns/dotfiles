# ai-usagebar — https://github.com/akitaonrails/ai-usagebar
# Managed in dotfiles (stow package: ai-usagebar).
# No secrets here: account-specific OAuth files live under
# ~/.config/ai-usagebar/accounts/, a live-only directory intentionally not
# tracked in this repo.

[ui]
# Vendor shown by the bare `ai-usagebar` and the tab the TUI opens on.
primary = "anthropic"

[anthropic]
enabled = true
# Both Claude subscriptions use dedicated credentials. Normal Claude
# login/logout and claude-bridge changes cannot affect them.
# "claude-dev" (developer@trueleap.io) is the default account shown by bare
# `ai-usagebar`.
# Reauthenticate only this account with:
#   CLAUDE_CONFIG_DIR=~/.config/ai-usagebar/accounts/claude-dev \
#     claude auth login --email developer@trueleap.io
credentials_path = "/home/bikash/.config/ai-usagebar/accounts/claude-dev/.credentials.json"

# "claude-hello" (hello@trueleap.io) is selected with `--account hello`.
# ai-usagebar refreshes each account's token in its own file independently.
# Reauthenticate only this account with:
#   CLAUDE_CONFIG_DIR=~/.config/ai-usagebar/accounts/claude-hello \
#     claude auth login --email hello@trueleap.io
[[anthropic.accounts]]
label = "hello"
credentials_path = "/home/bikash/.config/ai-usagebar/accounts/claude-hello/.credentials.json"

[openai]
enabled = true
# Both Codex subscriptions use dedicated auth files, so normal `codex login`
# and `codex logout` cannot affect ai-usagebar. "codex-dev"
# (developer@trueleap.io) is the default UsageBar Codex account.
# Reauthenticate only this copy with:
#   CODEX_HOME=~/.config/ai-usagebar/accounts/codex-dev codex login
codex_auth_path = "/home/bikash/.config/ai-usagebar/accounts/codex-dev/auth.json"
# "codex-personal" (bphkns@gmail.com) can't be selected by a CLI flag, so it
# uses a separate config via XDG_CONFIG_HOME (see
# ~/.config/ai-usagebar-codex-personal/ai-usagebar/config.toml).

# Vendors we don't use — disabled so the TUI and scroll-cycle stay uncluttered.
[zai]
enabled = false

[openrouter]
enabled = false

[deepseek]
enabled = false

[kimi]
enabled = false
